services:
  # 1. Frontend (Render Static Site - FREE)
  - type: static_site
    name: skillpilot-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: skillpilot-backend
          property: host
          envVarKey: VITE_API_URL

  # 2. Backend (Render Web Service - Python/FastAPI)
  - type: web
    name: skillpilot-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: LLM_PROVIDER
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  # 3. PostgreSQL Database (Free Managed DB)
  - name: skillpilot-db
    plan: free
    databaseName: skillpilot
    user: skillpilot
