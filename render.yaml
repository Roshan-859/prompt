services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: skillpilot-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.db.init_db && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillpilot-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: LLM_PROVIDER
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"

databases:
  # 2. Managed PostgreSQL Database
  - name: skillpilot-db
    plan: free
    databaseName: skillpilot
    user: skillpilot
